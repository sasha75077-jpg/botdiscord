<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melancholia Panel</title>
    <!--
      Начинаем DNS+TLS к API сразу при разборе HTML, пока грузится бандл.
      Без этого первые XHR уходят по холодному соединению и на медленном
      канале к workers.dev провисают 10-20 секунд.
    -->
    <link rel="preconnect" href="https://melancholia-api.sasha75077.workers.dev" crossorigin />
    <link rel="dns-prefetch" href="https://melancholia-api.sasha75077.workers.dev" />
    <script>
      // Если Discord отдал код на index.html (?code=...), а hash-маршрута ещё нет —
      // переводим его в hash, иначе HashRouter его не увидит.
      try {
        if (!location.hash && /[?&]code=/.test(location.search)) {
          location.replace('%BASE_URL%#/auth/callback' + location.search);
        }
      } catch (e) {}
    </script>
    <script>
      // Тема до отрисовки (без мигания): auto = за системой
      try {
        var t = localStorage.getItem('theme') || 'auto';
        if (t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
