name = "melancholia-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"

[observability]
enabled = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "melancholia-db"
database_id = "c841094d-0183-4369-ae5e-43cca4c2632f"

# R2 Bucket for credentials (TODO: uncomment after creating bucket)
# [[r2_buckets]]
# binding = "CREDENTIALS_BUCKET"
# bucket_name = "melancholia-credentials"

# KV для кэша (TODO: uncomment after creating namespace)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "placeholder"

# Environment variables
[vars]
DISCORD_API_ENDPOINT = "https://discord.com/api/v10"
FRONTEND_URL = "https://botdiscord-87a.pages.dev"

# Secrets (set via wrangler secret put)
# DISCORD_CLIENT_ID
# DISCORD_CLIENT_SECRET
# DISCORD_BOT_TOKEN
# SECRET_KEY
# OWNER_EMAIL
# OWNER_PASSWORD
